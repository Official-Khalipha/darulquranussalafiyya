<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karatu</title>
<style>
 body{margin:0;background:#000;height:100vh;display:flex;flex-direction:column}
 .top{padding:12px;background:#000;color:#fff;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333}
 .top a{color:#d4a017;text-decoration:none;font-weight:bold}
 #viewer{flex:1;border:0;width:100%;height:100%}
</style>
</head>
<body>
<div class="top">
 <a href="littattafai.html">← Koma</a>
 <span id="t">Karatu...</span>
 <a id="dl" href="#" download style="color:#d4a017">Sauke</a>
</div>
<iframe id="viewer"></iframe>
<script>
 const file = new URLSearchParams(location.search).get('file');
 if(file){
   const fullUrl = location.origin + '/' + file;
   // Wannan shine viewer da zai bude PDF a waya ba tare da download ba
   document.getElementById('viewer').src = `https://mozilla.github.io/pdf.js/web/viewer.html?file=${encodeURIComponent(fullUrl)}`;
   document.getElementById('dl').href = file;
   document.getElementById('t').textContent = file.split('/').pop();
 }
</script>
</body>
</html>
