<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Karanta Littafi - Darul Qur'anus Salafiyya</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#f3f6f1;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

/* ===== HEADER ===== */
.header{
  background:#0f5d2e;
  color:white;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header h2{
  font-size:16px;
  text-align:center;
  flex:1;
}

.back-btn{
  color:white;
  text-decoration:none;
  background:rgba(255,255,255,0.15);
  padding:8px 12px;
  border-radius:20px;
  font-size:13px;
}

/* ===== PDF READER ===== */
.reader{
  width:100%;
  height:calc(100vh - 65px);
  background:#333;
}

/* PDF viewer */
#pdfViewer{
  width:100%;
  height:100%;
  border:none;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

  <a href="javascript:history.back()" class="back-btn">
    ⬅️ Komawa
  </a>

  <h2>📖 Karatun Littafi</h2>

  <div style="width:65px;"></div>

</div>

<!-- PDF -->
<div class="reader">

  <iframe id="pdfViewer"></iframe>

</div>

<script>

/* ===== KARƆ PDF DAGA URL ===== */

const params = new URLSearchParams(window.location.search);

const file = params.get("file");

const viewer = document.getElementById("pdfViewer");

if(file){

  viewer.src = file;

}else{

  document.body.innerHTML = `
    <div style="
      text-align:center;
      padding:50px 20px;
      font-family:Arial;
    ">
      <h2>❌ Ba a sami littafin ba</h2>

      <p style="margin-top:10px;">
        Babu PDF da aka turo domin karantawa.
      </p>

      <br>

      <a href="index.html"
         style="
         display:inline-block;
         padding:10px 18px;
         background:#0f5d2e;
         color:white;
         text-decoration:none;
         border-radius:20px;
         ">
         ⬅️ Koma Gida
      </a>
    </div>
  `;

}

</script>

</body>
</html>
