<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karatu</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a1a;color:#fff;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}
.header{background:#000;padding:10px 15px;display:flex;justify-content:space-between;align-items:center}
.header a{color:#f0b429;text-decoration:none;font-weight:bold}
iframe{flex:1;width:100%;border:none;background:#fff}
</style>
</head>
<body>
<div class="header">
<a href="littattafai.html">← Koma</a>
<div id="name" style="font-size:13px;opacity:0.8">...</div>
<a href="#" id="down" download>Sauke</a>
</div>
<iframe id="view"></iframe>
<script>
const p = new URLSearchParams(window.location.search).get('file');
if(p){
  document.getElementById('name').textContent = p.split('/').pop();
  document.getElementById('down').href = p;
  const abs = "https://khalipha.github.io/" + p;
  const viewer = "https://mozilla.github.io/pdf.js/web/viewer.html?file=" + encodeURIComponent(abs);
  document.getElementById('view').src = viewer;
}
</script>
</body>
</html>
